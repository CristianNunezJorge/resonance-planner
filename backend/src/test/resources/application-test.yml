# Automated tests (D79): test database of Docker Compose and fixed values that are not secrets.
# Database username and password come from the .env file, like in development.
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

app:
  database:
    url: jdbc:postgresql://localhost:5433/resonance_planner_test
  jwt:
    secret: test-only-jwt-secret-never-used-outside-the-tests
  admin:
    email: admin@example.com
    password: test-only-admin-password
  cors:
    allowed-origins: http://localhost:5173
  # The tests of all the classes call the application from the same address and share its counters: the limits are
  # so high that they never get in the way. RateLimitIntegrationTest sets its own small ones.
  rate-limit:
    auth-attempts: 100000
    general-requests: 100000
