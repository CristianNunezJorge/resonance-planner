# Settings shared by every profile (D83).
# Required values come from environment variables. The empty default after ":" lets
# AppProperties stop the startup with the name of the missing variable.
app:
  database:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # The agent runs on a free model of OpenRouter (D126)
  agent:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:}
  # "Today" for the whole app: event editions, calendar days, daily limits (D41). Moments stay in UTC
  time-zone: Europe/Rome

spring:
  application:
    name: resonance-planner
  profiles:
    # Used when no profile is chosen; Render sets SPRING_PROFILES_ACTIVE=prod
    default: dev
  web:
    # Interface in Italian (D71): default validation messages too, whatever the server's language
    locale: it
    locale-resolver: fixed
  jackson:
    deserialization:
      # 12.5 for a whole number is an error (400), not a silent 12: the quantities, levels and Waveplate are whole
      accept-float-as-int: false
    factory:
      constraints:
        read:
          # The public login and registration read a JSON body before any check: without a limit (the default is
          # 100 million characters) a single request could fill the 512 MB of the free server
          max-string-length: 20000
          # The same for the whole body: @Size on a list runs only after Jackson created every element, so without these
          # two limits a body of a few MB (millions of empty elements) could fill the 512 MB of the free server. A real
          # request is a few KB: the biggest, the guided setup, is about 1 KB with the six characters of the demo
          max-document-length: 100000
          max-token-count: 5000
  # No spring.datasource here: the DataSource is built from app.database by DatabaseConfig
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it (D38)
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Moments are stored in UTC (D41, D43)
          time_zone: UTC
        # The collections of many events (days, rewards, activities) load in one query each, not one per event
        default_batch_fetch_size: 16

# Swagger stays public, also in production (D53)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
