# Production on Render (D82): every value comes from the environment variables set on Render.
server:
  # Render tells the service which port to listen on
  port: ${PORT:8080}
  # Render ends HTTPS in front of the app and forwards the original scheme, host and client address:
  # without this Swagger would build http:// links and every user would look like the same address
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # The request reaches the application through Cloudflare and a proxy of Render, and X-Forwarded-For ends with
      # "real client, Cloudflare node". Tomcat takes as client address the first one, from the right, that it does not
      # trust. With only the private networks it stopped at the Cloudflare node (a different one almost every time),
      # so the rate limits (D48, D101) counted nodes and not clients. The addresses of Cloudflare are trusted too:
      # Tomcat skips the node and stops at the real client, which Cloudflare added and a client cannot forge.
      # First the default list of Spring Boot (private networks and loopback), then the ranges of Cloudflare read on
      # 12/10/2026 from https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6: check them from time
      # to time, a missing range brings back the problem for the clients that reach us through it.
      internal-proxies: >-
        192.168.0.0/16, 172.16.0.0/12, 169.254.0.0/16, fc00::/7, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, fe80::/10,
        ::1/128,
        173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
        190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
        104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22,
        2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32
